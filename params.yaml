# Single source of truth for pipeline settings.
# Read by DVC (dvc.yaml templating, change detection) and by recsys.config.load_params.

data:
  # KuaiRec on Zenodo: https://zenodo.org/records/18164998 (CC BY 4.0)
  url: https://zenodo.org/api/records/18164998/files/KuaiRec.zip/content
  md5: 261550d472c48eff4990fb13c0e5bcf7
  archive_path: data/raw/KuaiRec.zip
  processed_dir: data/processed
  summary_path: reports/data_summary.json
  splits_dir: data/splits
  split_summary_path: reports/split_summary.json

label:
  # People watch ~7.5 s of a video whatever its length, so raw watch_ratio mostly measures
  # shortness. A view is positive when its watch_ratio is above the positive_quantile of
  # training views of similar-length videos. Length buckets are log-spaced (each spans at most
  # bucket_width_ratio x in length) and merged until each holds min_views_per_bucket views.
  bucket_width_ratio: 1.15
  min_views_per_bucket: 10000
  positive_quantile: 0.8

split:
  # train/valid: global temporal split of big_matrix (local date, Asia/Shanghai).
  valid_start: "2020-08-30"  # quoted: DVC params must be plain strings/numbers, not YAML dates
  # tune/test: small_matrix (fully observed) split by a stable hash of salt:user_id.
  tune_user_share: 0.2
  assignment_salt: kuairec-tune-v1
