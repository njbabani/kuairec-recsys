# Single source of truth for pipeline settings.
# Read by DVC (dvc.yaml templating, change detection) and by recsys.config.load_params.

data:
  # KuaiRec on Zenodo: https://zenodo.org/records/18164998 (CC BY 4.0)
  url: https://zenodo.org/api/records/18164998/files/KuaiRec.zip/content
  md5: 261550d472c48eff4990fb13c0e5bcf7
  archive_path: data/raw/KuaiRec.zip
  processed_dir: data/processed
  summary_path: reports/data_summary.json
  splits_dir: data/splits
  split_summary_path: reports/split_summary.json
  metrics_dir: reports/metrics
  features_dir: data/features
  checkpoints_dir: checkpoints  # resumable training state; removed once a stage succeeds
  models_dir: models  # trained models from the leaderboard (DVC output)
  retrieval_path: data/retrieval/two_tower_scores.parquet  # stage-1 scores for the re-ranker
  reranker_dir: data/reranker  # SHAP sample for the notebook
  ab_dir: data/ab  # A/B sessions and per-user outcomes

label:
  # People watch ~7.5 s of a video whatever its length, so raw watch_ratio mostly measures
  # shortness. A view is positive when its watch_ratio is above the positive_quantile of
  # training views of similar-length videos. Length buckets are log-spaced (each spans at most
  # bucket_width_ratio x in length) and merged until each holds min_views_per_bucket views.
  bucket_width_ratio: 1.15
  min_views_per_bucket: 10000
  positive_quantile: 0.8

split:
  # train/valid: global temporal split of big_matrix (local date, Asia/Shanghai).
  valid_start: "2020-08-30"  # quoted: DVC params must be plain strings/numbers, not YAML dates
  # tune/test: small_matrix (fully observed) split by a stable hash of salt:user_id.
  tune_user_share: 0.2
  assignment_salt: kuairec-tune-v1

evaluation:
  # Per-user ranking metrics on the tune users (fully observed), averaged over users,
  # with 95% bootstrap confidence intervals. Model selection uses select_metric.
  ks: [10, 50]
  bootstrap_samples: 1000
  seed: 42
  select_metric: ndcg_at_10

# Every model on the leaderboard (stage `leaderboard`). Searched models take the best
# configuration their search stage reports (copied here by hand, so the choice is reviewable).
models:
  random:
    seed: 42
  popularity_engagement:
    # Pseudo-views pulling each video's positive rate towards the global rate (empirical Bayes)
    prior_strength: 50
  category_affinity:
    # Pseudo-views pulling a user's positive rate in a category towards that category's rate
    prior_strength: 20
  als:
    factors: 64
    regularization: 0.1
    alpha: 1
    iterations: 15
    seed: 42
  two_tower:  # chosen from reports/metrics/two_tower_search.json
    loss: bce
    embedding_dim: 32
    hidden_dim: 128
    epochs: 7
    batch_size: 4096
    learning_rate: 0.001
    weight_decay: 0.0
    # One model per seed: the leaderboard reports their spread and scores their average
    # (a single run varies by about +-0.006 NDCG@10, as much as the gaps being compared).
    seeds: [42, 43, 44]
    device: cpu  # deterministic, and as fast as MPS for a model this small

als_search:
  factors: [16, 32, 64]
  regularization: [0.1, 0.3, 1.0]
  alpha: [0, 1, 4, 16]
  iterations: 15
  seed: 42

two_tower_search:
  # bce: is this view positive? (all logged views, matching what evaluation asks)
  # softmax: which video did this user like? (positives only, in-batch negatives, logQ fix)
  loss: [bce, softmax]
  embedding_dim: [32, 64]
  temperature: [0.1, 0.2]  # softmax only
  seeds: [42, 43, 44]  # each configuration trains once per seed; selection uses the seed average
  hidden_dim: 128
  epochs: 10  # scored on tune after every epoch, so the epoch count is searched too
  batch_size: 4096
  learning_rate: 0.001
  weight_decay: 0.0
  device: cpu

reranker:
  # Stage 2: LightGBM LambdaRank re-orders the two-tower model's top candidates. It learns from
  # the validation week (logged views from Aug 30, features from before it) of users outside
  # the fully observed matrix, and is tuned on a held-out slice of them: the tune and test users
  # play no part in training or tuning it.
  retrieve_top_n: 200
  holdout_user_share: 0.1  # validation users that stop boosting and pick the configuration
  report_user_share: 0.1  # validation users used only to report the logged-data comparison
  holdout_salt: kuairec-ranker-holdout-v1
  cross_fit_folds: 5  # upper-bound check: rankers cross-fitted on fully observed tune users
  num_leaves: [31, 127]
  min_child_samples: [100, 1000]
  learning_rate: 0.05
  feature_fraction: 0.8
  max_rounds: 2000
  early_stopping_rounds: 100
  eval_at: 10
  prior_strength: 20
  shap_sample_rows: 5000
  seed: 42

ab_test:
  # Offline A/B experiments on the 1,112 fully observed test users. A session is a policy's top
  # videos for a user; its outcome (liked videos, watch time) is the user's recorded reaction.
  session_length: 10
  treatment_share: 0.5
  salt: kuairec-ab-v1  # stable hash of salt:user_id assigns the arms
  alpha: 0.05
  power: 0.8
  simulations: 2000  # re-randomised experiments behind every operating characteristic
  looks: 10  # interim looks in the sequential-testing (peeking) demo
  srm_drop_shares: [0.05, 0.1, 0.2, 0.3]  # treatment users a simulated logging bug loses
  seed: 42
  aa_policy: two_tower
  experiments:
    - {name: als_vs_popularity, control: popularity_engagement, treatment: als}
    - {name: two_tower_vs_als, control: als, treatment: two_tower}
    - {name: two_stage_vs_two_tower, control: two_tower, treatment: two_stage}
  primary_experiment: two_tower_vs_als

tracking:
  backends: [mlflow, wandb]
  experiment: kuairec-recsys
  mlflow_tracking_uri: sqlite:///mlflow.db
  wandb_project: kuairec-recsys
  wandb_mode: offline  # after `wandb login`, set WANDB_MODE=online to publish runs
