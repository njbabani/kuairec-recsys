# Reproducible data + modelling pipeline. Run everything with `dvc repro`;
# DVC re-runs a stage only when its deps, params or outputs change.

stages:
  download:
    cmd: python -m recsys.data.download
    deps:
      - src/recsys/config.py
      - src/recsys/data/download.py
    params:
      - data.url
      - data.md5
    outs:
      # persist: DVC would otherwise delete the 432 MB archive before every re-run; kept in
      # place, download.py reuses it when its MD5 still matches instead of re-downloading.
      - ${data.archive_path}:
          persist: true

  prepare:
    cmd: python -m recsys.data.prepare
    deps:
      - ${data.archive_path}
      - src/recsys/config.py
      - src/recsys/io.py
      - src/recsys/data/prepare.py
      - src/recsys/data/schemas.py
    outs:
      - ${data.processed_dir}
    metrics:
      - ${data.summary_path}:
          cache: false

  split:
    cmd: python -m recsys.data.split
    deps:
      - ${data.processed_dir}
      - src/recsys/config.py
      - src/recsys/hashing.py
      - src/recsys/io.py
      - src/recsys/data/labels.py
      - src/recsys/data/schemas.py
      - src/recsys/data/split.py
    params:
      - label
      - split
    outs:
      - ${data.splits_dir}
    metrics:
      - ${data.split_summary_path}:
          cache: false

  features:
    cmd: python -m recsys.data.features
    deps:
      - ${data.processed_dir}
      - src/recsys/config.py
      - src/recsys/io.py
      - src/recsys/data/features.py
    outs:
      - ${data.features_dir}

  als_search:
    cmd: python -m recsys.experiments.als_search
    deps:
      - ${data.splits_dir}
      - src/recsys/config.py
      - src/recsys/io.py
      - src/recsys/tracking.py
      - src/recsys/evaluation/concentration.py
      - src/recsys/evaluation/ranking.py
      - src/recsys/evaluation/selection.py
      - src/recsys/experiments/als_search.py
      - src/recsys/experiments/runner.py
      - src/recsys/models/als.py
      - src/recsys/models/base.py
    params:
      - als_search
      - evaluation
    metrics:
      - ${data.metrics_dir}/als_search.json:
          cache: false

  two_tower_search:
    cmd: python -m recsys.experiments.two_tower_search
    deps:
      - ${data.splits_dir}
      - ${data.features_dir}
      - src/recsys/checkpointing.py
      - src/recsys/config.py
      - src/recsys/io.py
      - src/recsys/tracking.py
      - src/recsys/evaluation/concentration.py
      - src/recsys/evaluation/ranking.py
      - src/recsys/evaluation/selection.py
      - src/recsys/experiments/runner.py
      - src/recsys/experiments/two_tower_search.py
      - src/recsys/models/base.py
      - src/recsys/models/two_tower/checkpoint.py
      - src/recsys/models/two_tower/encoding.py
      - src/recsys/models/two_tower/network.py
      - src/recsys/models/two_tower/recommender.py
      - src/recsys/models/two_tower/training.py
    params:
      - two_tower_search
      - evaluation
    metrics:
      - ${data.metrics_dir}/two_tower_search.json:
          cache: false

  leaderboard:
    cmd: python -m recsys.experiments.leaderboard
    deps:
      - ${data.splits_dir}
      - ${data.features_dir}
      - src/recsys/checkpointing.py
      - src/recsys/config.py
      - src/recsys/io.py
      - src/recsys/tracking.py
      - src/recsys/evaluation/concentration.py
      - src/recsys/evaluation/ranking.py
      - src/recsys/experiments/leaderboard.py
      - src/recsys/experiments/runner.py
      - src/recsys/models/als.py
      - src/recsys/models/base.py
      - src/recsys/models/category_affinity.py
      - src/recsys/models/popularity.py
      - src/recsys/models/two_tower/checkpoint.py
      - src/recsys/models/two_tower/encoding.py
      - src/recsys/models/two_tower/ensemble.py
      - src/recsys/models/two_tower/network.py
      - src/recsys/models/two_tower/recommender.py
      - src/recsys/models/two_tower/training.py
    params:
      - models
      - evaluation
    outs:
      # The trained two-tower members, for later stages (re-ranker, demo). Versioned by DVC.
      - ${data.models_dir}/two_tower
    metrics:
      - ${data.metrics_dir}/leaderboard.json:
          cache: false

  retrieval:
    # The only later stage that loads PyTorch: scores every pair the re-ranker needs.
    cmd: python -m recsys.experiments.retrieval
    deps:
      - ${data.splits_dir}
      - ${data.models_dir}/two_tower
      - src/recsys/checkpointing.py
      - src/recsys/config.py
      - src/recsys/io.py
      - src/recsys/experiments/retrieval.py
      - src/recsys/models/two_tower/checkpoint.py
      - src/recsys/models/two_tower/encoding.py
      - src/recsys/models/two_tower/ensemble.py
      - src/recsys/models/two_tower/network.py
      - src/recsys/models/two_tower/recommender.py
      - src/recsys/models/two_tower/training.py
    params:
      - models.two_tower.device
    outs:
      - ${data.retrieval_path}

  reranker:
    cmd: python -m recsys.experiments.reranker
    deps:
      - ${data.splits_dir}
      - ${data.features_dir}
      - ${data.processed_dir}/video_daily_stats.parquet
      - ${data.retrieval_path}
      - src/recsys/checkpointing.py
      - src/recsys/config.py
      - src/recsys/io.py
      - src/recsys/hashing.py
      - src/recsys/tracking.py
      - src/recsys/data/labels.py
      - src/recsys/data/schemas.py
      - src/recsys/data/split.py
      - src/recsys/evaluation/concentration.py
      - src/recsys/evaluation/ranking.py
      - src/recsys/experiments/reranker.py
      - src/recsys/experiments/reranker_analysis.py
      - src/recsys/experiments/runner.py
      - src/recsys/models/als.py
      - src/recsys/models/base.py
      - src/recsys/models/category_affinity.py
      - src/recsys/models/popularity.py
      - src/recsys/reranking/candidates.py
      - src/recsys/reranking/features.py
      - src/recsys/reranking/ranker.py
      - src/recsys/reranking/two_stage.py
    params:
      - reranker
      - evaluation
      - split.valid_start
      - models.als
      - models.popularity_engagement
      - models.category_affinity
    outs:
      - ${data.models_dir}/reranker
      - ${data.reranker_dir}
    metrics:
      - ${data.metrics_dir}/reranker.json:
          cache: false

  final_evaluation:
    # The one-time evaluation on the untouched test users, and each policy's A/B sessions.
    cmd: python -m recsys.experiments.final_evaluation
    deps:
      - ${data.splits_dir}
      - ${data.features_dir}
      - ${data.processed_dir}/video_daily_stats.parquet
      - ${data.retrieval_path}
      - ${data.models_dir}/reranker
      - src/recsys/abtest/outcomes.py
      - src/recsys/checkpointing.py
      - src/recsys/config.py
      - src/recsys/data/labels.py
      - src/recsys/data/schemas.py
      - src/recsys/data/split.py
      - src/recsys/evaluation/concentration.py
      - src/recsys/evaluation/ranking.py
      - src/recsys/experiments/final_evaluation.py
      - src/recsys/experiments/reranker.py
      - src/recsys/experiments/reranker_analysis.py
      - src/recsys/experiments/runner.py
      - src/recsys/hashing.py
      - src/recsys/io.py
      - src/recsys/models/als.py
      - src/recsys/models/base.py
      - src/recsys/models/category_affinity.py
      - src/recsys/models/popularity.py
      - src/recsys/reranking/candidates.py
      - src/recsys/reranking/features.py
      - src/recsys/reranking/ranker.py
      - src/recsys/reranking/two_stage.py
      - src/recsys/tracking.py
    params:
      - models
      - reranker.prior_strength
      - reranker.retrieve_top_n
      - evaluation
      - split.valid_start
      - ab_test.session_length
    outs:
      - ${data.ab_dir}/sessions.parquet
    metrics:
      - ${data.metrics_dir}/test_evaluation.json:
          cache: false

  ab_test:
    cmd: python -m recsys.experiments.ab_test
    deps:
      - ${data.ab_dir}/sessions.parquet
      - ${data.splits_dir}
      - src/recsys/abtest/outcomes.py
      - src/recsys/abtest/simulation.py
      - src/recsys/abtest/stats.py
      - src/recsys/config.py
      - src/recsys/experiments/ab_test.py
      - src/recsys/hashing.py
      - src/recsys/io.py
      - src/recsys/tracking.py
    params:
      - ab_test
    outs:
      - ${data.ab_dir}/user_outcomes.parquet
    metrics:
      - ${data.metrics_dir}/ab_test.json:
          cache: false

  demo_data:
    # Compact tables for the Streamlit demo: each test user's sessions with their reactions,
    # and user profiles. The app reads only these, the A/B outcomes and the reports.
    cmd: python -m recsys.demo.bundle
    deps:
      - ${data.ab_dir}/sessions.parquet
      - ${data.ab_dir}/user_outcomes.parquet
      - ${data.splits_dir}
      - ${data.processed_dir}/video_captions.parquet
      - src/recsys/abtest/outcomes.py
      - src/recsys/config.py
      - src/recsys/data/categories.py
      - src/recsys/demo/bundle.py
      - src/recsys/io.py
    outs:
      - ${data.demo_dir}/sessions.parquet
      - ${data.demo_dir}/users.parquet
