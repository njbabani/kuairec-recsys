# W&B Bayesian hyperparameter sweep for ALS, scored on the tune users.
# Needs a W&B account: run `wandb login` once, then `make sweep-als` and start the
# `wandb agent ...` command it prints. The local grid (`dvc repro als_search`) needs no account.
program: src/recsys/experiments/als_search.py
command: [uv, run, python, -m, recsys.experiments.als_search, --sweep-trial]
method: bayes
metric:
  name: ndcg_at_10
  goal: maximize
parameters:
  factors:
    values: [32, 64, 128, 256]
  regularization:
    distribution: log_uniform_values
    min: 0.001
    max: 1.0
  alpha:
    distribution: log_uniform_values
    min: 1.0
    max: 100.0
  iterations:
    value: 15
  seed:
    value: 42
